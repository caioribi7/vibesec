[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vibesec"
version = "0.1.0"
description = "Pentest de ponta a ponta para repositórios do GitHub: análise de código, segredos, dependências e ataques reais numa sandbox Docker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "caioribi7" }]
keywords = ["security", "pentest", "sast", "dast", "cli", "nmap", "devsecops"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.60"]
db = ["psycopg[binary]>=3.1"]
all = ["anthropic>=0.60", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vibesec = "vibesec.cli:app"

[project.urls]
Homepage = "https://github.com/caioribi7/vibesec"

[tool.hatch.build.targets.wheel]
packages = ["src/vibesec"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731", "B008", "B023", "B904"]  # B008/B904: padrão do Typer

[tool.pytest.ini_options]
testpaths = ["tests"]
