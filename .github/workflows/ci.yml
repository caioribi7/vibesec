name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  sandbox-e2e:
    # roda o pentest completo (Docker + nmap/nuclei/ZAP) contra o app vulnerável de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: vibesec scan tests/fixtures/vulnapp --mode full --depth quick -y -q --out e2e
      - name: Confere que a sandbox subiu e os ataques confirmaram falhas
        run: |
          python - <<'EOF'
          import glob, json
          r = json.load(open(glob.glob("e2e/*/report.json")[0]))
          tools = {t["name"]: t["status"] for t in r["tools"]}
          assert tools.get("sandbox") == "ok", tools
          for name in ("vibesec-probe", "semgrep", "trivy", "nmap", "nuclei", "zap", "tshark"):
              assert tools.get(name) == "ok", (name, tools)
          ids = {f["rule_id"] for f in r["findings"] if f["confirmed"]}
          print(tools)
          print(sorted(ids))
          # falhas plantadas no app de teste que precisam ser exploradas de verdade
          assert "exposed/console" in ids, "console do Werkzeug não detectado"
          assert "xss-reflected-name" in ids, "XSS refletido não explorado"
          assert "sqli-error-id" in ids, "SQL injection não explorado"
          EOF
      # modo offline: bases baixadas antes, depois nenhum container acessa a internet
      - run: vibesec update
      - run: vibesec scan tests/fixtures/vulnapp --mode full --depth quick --offline -y -q --out e2e-offline
      - name: Confere o modo offline
        run: |
          python - <<'EOF'
          import glob, json
          r = json.load(open(glob.glob("e2e-offline/*/report.json")[0]))
          tools = {t["name"]: t["status"] for t in r["tools"]}
          print(tools)
          for name in ("sandbox", "vibesec-probe", "semgrep", "trivy", "nmap", "nuclei", "zap", "tshark"):
              assert tools.get(name) == "ok", (name, tools)
          assert "osv-scanner" not in tools  # precisa de internet: desligado no offline
          ids = {f["rule_id"] for f in r["findings"] if f["confirmed"]}
          assert {"exposed/console", "xss-reflected-name", "sqli-error-id"} <= ids, sorted(ids)
          assert any(f["category"] == "dependency" for f in r["findings"]), "base local do Trivy não usada"
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e
            e2e-offline
